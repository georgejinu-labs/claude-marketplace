name: Update plugin SHA

on:
  repository_dispatch:
    types: [plugin-updated]

permissions:
  contents: write

jobs:
  update-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump pinned sha for each changed plugin
        run: |
          FILE=.claude-plugin/marketplace.json
          SHA="${{ github.event.client_payload.sha }}"
          echo '${{ toJson(github.event.client_payload.plugins) }}' > /tmp/plugins.json
          for PLUGIN in $(jq -r '.[]' /tmp/plugins.json); do
            jq --arg name "$PLUGIN" --arg sha "$SHA" \
              '(.plugins[] | select(.name == $name) | .source.sha) = $sha' \
              "$FILE" > /tmp/marketplace.json && mv /tmp/marketplace.json "$FILE"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump plugin sha from ${{ github.event.client_payload.repo }}@${{ github.event.client_payload.sha }}"
            git push
          fi
